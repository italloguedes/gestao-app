<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanvon ESP560 - Captura de Assinatura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .instruction-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .instruction-banner .icon {
            font-size: 32px;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        .instruction-banner .text {
            display: inline-block;
            vertical-align: middle;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected {
            background: #28a745;
        }

        .status-dot.capturing {
            background: #ffc107;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .canvas-container {
            position: relative;
            border: 2px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            background: white;
            margin-bottom: 20px;
        }

        .canvas-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .canvas-overlay.active {
            opacity: 1;
        }

        .canvas-instruction {
            background: rgba(255, 193, 7, 0.95);
            color: #333;
            padding: 20px 30px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: pulseInstruction 2s ease-in-out infinite;
        }

        .canvas-instruction-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        @keyframes pulseInstruction {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .preview-label {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 123, 255, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            z-index: 5;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: default;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start {
            background: #28a745;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .btn-stop {
            background: #dc3545;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-save {
            background: #007bff;
            color: white;
        }

        .btn-save:hover:not(:disabled) {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-clear {
            background: #6c757d;
            color: white;
        }

        .btn-clear:hover:not(:disabled) {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.3);
        }

        .info-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #dee2e6;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #495057;
        }

        .info-value {
            color: #6c757d;
            font-family: monospace;
        }

        .hash-value {
            font-size: 11px;
            word-break: break-all;
        }

        .logs {
            background: #212529;
            color: #00ff00;
            padding: 15px;
            border-radius: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }

        .log-entry {
            margin-bottom: 5px;
        }

        .log-timestamp {
            color: #6c757d;
        }

        .log-error {
            color: #ff6b6b;
        }

        .log-success {
            color: #51cf66;
        }

        .log-info {
            color: #74c0fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hanvon ESP560</h1>
        <p class="subtitle">Sistema de Captura de Assinatura Digital</p>

        <div class="instruction-banner">
            <span class="icon">✍️</span>
            <span class="text">ASSINE NO DISPOSITIVO HANVON ESP560 (PAD FÍSICO)</span>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-dot" id="connectionStatus"></div>
                <span id="connectionText">Desconectado</span>
            </div>
            <div class="status-item">
                <span id="pointCount">0 pontos</span>
            </div>
        </div>

        <div class="canvas-container">
            <div class="preview-label">📺 VISUALIZAÇÃO EM TEMPO REAL</div>
            <div class="canvas-overlay" id="canvasOverlay">
                <div class="canvas-instruction">
                    <span class="canvas-instruction-icon">✍️</span>
                    ASSINE NO PAD<br>HANVON ESP560
                </div>
            </div>
            <canvas id="signatureCanvas" width="640" height="480"></canvas>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn-start">Iniciar Captura</button>
            <button id="btnStop" class="btn-stop" disabled>Parar Captura</button>
            <button id="btnSave" class="btn-save" disabled>Salvar Assinatura</button>
            <button id="btnClear" class="btn-clear">Limpar Canvas</button>
        </div>

        <div class="info-panel" id="infoPanel" style="display: none;">
            <div class="info-row">
                <span class="info-label">Total de Pontos:</span>
                <span class="info-value" id="infoPoints">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Hash PNG (SHA-256):</span>
                <span class="info-value hash-value" id="infoPngHash">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Hash JSON (SHA-256):</span>
                <span class="info-value hash-value" id="infoJsonHash">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Timestamp:</span>
                <span class="info-value" id="infoTimestamp">-</span>
            </div>
        </div>

        <div class="logs" id="logs"></div>
    </div>

    <script>
        // Configuração
        const WS_URL = 'ws://127.0.0.1:9123/ws';
        const RECONNECT_INTERVAL = 3000;

        // Estado
        let ws = null;
        let reconnectTimer = null;
        let isCapturing = false;
        let pointCount = 0;
        let lastPoint = null;

        // Elementos DOM
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const btnSave = document.getElementById('btnSave');
        const btnClear = document.getElementById('btnClear');
        const connectionStatus = document.getElementById('connectionStatus');
        const connectionText = document.getElementById('connectionText');
        const pointCountEl = document.getElementById('pointCount');
        const logsEl = document.getElementById('logs');
        const infoPanel = document.getElementById('infoPanel');
        const canvasOverlay = document.getElementById('canvasOverlay');

        // Inicializa canvas
        function initCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#000000';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
        }

        initCanvas();

        // Logging
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;
            logsEl.appendChild(entry);
            logsEl.scrollTop = logsEl.scrollHeight;

            // Limita a 100 entradas
            while (logsEl.children.length > 100) {
                logsEl.removeChild(logsEl.firstChild);
            }
        }

        // WebSocket Connection
        function connect() {
            if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
                return;
            }

            log('Conectando ao bridge...', 'info');
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                log('Conectado ao bridge!', 'success');
                connectionStatus.classList.add('connected');
                connectionText.textContent = 'Conectado';

                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }

                // Envia ping periodicamente
                setInterval(() => {
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ command: 'ping' }));
                    }
                }, 30000);
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);
                    handleMessage(message);
                } catch (error) {
                    log(`Erro ao processar mensagem: ${error.message}`, 'error');
                }
            };

            ws.onerror = (error) => {
                log('Erro na conexão WebSocket', 'error');
            };

            ws.onclose = () => {
                log('Desconectado do bridge', 'error');
                connectionStatus.classList.remove('connected', 'capturing');
                connectionText.textContent = 'Desconectado';

                // Tenta reconectar
                if (!reconnectTimer) {
                    reconnectTimer = setTimeout(connect, RECONNECT_INTERVAL);
                    log(`Reconectando em ${RECONNECT_INTERVAL / 1000}s...`, 'info');
                }
            };
        }

        // Message Handler
        function handleMessage(message) {
            switch (message.type) {
                case 'connected':
                    log(`Cliente conectado: ${message.clientId}`, 'success');
                    break;

                case 'point':
                    handlePoint(message.data);
                    break;

                case 'state':
                    handleStateChange(message.isCapturing);
                    break;

                case 'saved':
                    handleSaved(message);
                    break;

                case 'start_response':
                case 'stop_response':
                    log(message.message, message.success ? 'success' : 'error');
                    break;

                case 'error':
                    log(`Erro: ${message.message}`, 'error');
                    break;

                case 'pong':
                    // Resposta ao ping
                    break;

                default:
                    log(`Mensagem desconhecida: ${message.type}`, 'info');
            }
        }

        // Desenha ponto no canvas (VISUALIZAÇÃO do que está sendo assinado no pad)
        function handlePoint(point) {
            pointCount++;
            pointCountEl.textContent = `${pointCount} pontos`;

            // Remove overlay após primeiro ponto
            if (pointCount === 1) {
                canvasOverlay.classList.remove('active');
            }

            // Só desenha se a caneta está tocando (penStatus === 1)
            if (point.penStatus !== 1) {
                lastPoint = null;
                return;
            }

            if (lastPoint) {
                // Calcula espessura baseada na pressão (1-3 pixels)
                const lineWidth = 1 + point.pressure * 2;

                ctx.beginPath();
                ctx.lineWidth = lineWidth;
                ctx.moveTo(lastPoint.x, lastPoint.y);
                ctx.lineTo(point.x, point.y);
                ctx.stroke();
            }

            lastPoint = { x: point.x, y: point.y };
        }

        // Mudança de estado de captura
        function handleStateChange(capturing) {
            isCapturing = capturing;

            if (capturing) {
                connectionStatus.classList.add('capturing');
                btnStart.disabled = true;
                btnStop.disabled = false;
                btnSave.disabled = true;
                pointCount = 0;
                pointCountEl.textContent = '0 pontos';
                lastPoint = null;

                // Mostra overlay de instrução
                canvasOverlay.classList.add('active');
                log('⚠️ ASSINE NO DISPOSITIVO FÍSICO HANVON ESP560!', 'info');
            } else {
                connectionStatus.classList.remove('capturing');
                btnStart.disabled = false;
                btnStop.disabled = true;
                btnSave.disabled = pointCount === 0;

                // Esconde overlay
                canvasOverlay.classList.remove('active');
            }
        }

        // Assinatura salva
        function handleSaved(data) {
            log(`Assinatura salva: ${data.count} pontos`, 'success');

            // Exibe informações
            infoPanel.style.display = 'block';
            document.getElementById('infoPoints').textContent = data.count;
            document.getElementById('infoPngHash').textContent = data.pngHash;
            document.getElementById('infoJsonHash').textContent = data.jsonHash;
            document.getElementById('infoTimestamp').textContent = new Date(data.timestamp).toLocaleString();

            // Download PNG
            const pngLink = document.createElement('a');
            pngLink.href = data.png;
            pngLink.download = `assinatura_${data.timestamp}.png`;
            pngLink.click();
            log('PNG baixado', 'success');

            // Download JSON
            const jsonBlob = new Blob([data.json], { type: 'application/json' });
            const jsonUrl = URL.createObjectURL(jsonBlob);
            const jsonLink = document.createElement('a');
            jsonLink.href = jsonUrl;
            jsonLink.download = `assinatura_${data.timestamp}.json`;
            jsonLink.click();
            URL.revokeObjectURL(jsonUrl);
            log('JSON baixado', 'success');
        }

        // Event Listeners
        btnStart.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'start' }));
                log('Comando INICIAR enviado', 'info');
            }
        });

        btnStop.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'stop' }));
                log('Comando PARAR enviado', 'info');
            }
        });

        btnSave.addEventListener('click', () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ command: 'save' }));
                log('Comando SALVAR enviado', 'info');
            }
        });

        btnClear.addEventListener('click', () => {
            initCanvas();
            lastPoint = null;
            log('Canvas limpo', 'info');
        });

        // Inicia conexão
        connect();

        log('Interface iniciada', 'success');
        log('⚠️ Este canvas é apenas VISUALIZAÇÃO em tempo real', 'info');
        log('✍️ A assinatura deve ser feita no PAD FÍSICO Hanvon ESP560', 'info');
        log(`Conectando a ${WS_URL}...`, 'info');
    </script>
</body>
</html>
